cli.help=Moodle CLI\n\
    \n\
    Usage: moodle [--lang de|en] [--no-store] <command>\n\
    \n\
    --help                 Show help\n\
    --lang de|en           Override the system language (English fallback)\n\
    --no-store             Do not read or write Keychain; use process memory only\n\
    health                 Check public API configuration\n\
    logout                 Remove the saved local login\n\
    login                  Automatic callback in a separate private Chrome window\n\
    login --manual         Copy the app callback from your normal browser\n\
    courses                List enrolled courses (requires login)\n\
    course <id>            Show sections, text, and downloadable files\n\
    read <course> <module> Read an activity or text page\n\
    assignments [--course <id>]\n\
    \                       List assignments, deadlines, and submission statuses (alias: tasks)\n\
    quizzes [--course <id>] List quizzes and learning checks separately\n\
    upcoming --days <n>    Show assignments due within the next n days\n\
    download <course> <module> <file-number> [directory]\n\
    \                       Save a file without overwriting existing files\n\
    \n\
    Planned: setup <url>\n\
    After login: courses, course, read, download, assignments, tasks, quizzes, upcoming, health, logout, exit\n\
    \n\
    By default, login is saved in macOS Keychain. --no-store keeps it only in memory.

