cli.help=Moodle CLI\n\
    \n\
    Aufruf: moodle [--lang de|en] <befehl>\n\
    \n\
    --help                 Hilfe anzeigen\n\
    --lang de|en           Systemsprache überschreiben (sonst Englisch als Ersatz)\n\
    health                 Öffentliche API-Konfiguration prüfen\n\
    login                  Automatische Anmeldung im separaten privaten Chrome-Fenster\n\
    login --manual         App-Link aus deinem normalen Browser kopieren\n\
    courses                Eingeschriebene Kurse auflisten (Anmeldung erforderlich)\n\
    course <id>            Abschnitte, Texte und herunterladbare Dateien anzeigen\n\
    read <kurs> <modul>    Aktivität oder Textseite lesen\n\
    tasks [--course <id>]  Aufgaben, Abgabefristen und Abgabestatus anzeigen\n\
    upcoming --days <n>    Aufgaben mit Frist innerhalb der nächsten n Tage anzeigen\n\
    download <kurs> <modul> <dateinummer> [ordner]\n\
    \                       Datei \
    speichern, ohne vorhandene Dateien zu überschreiben\n\
    \n\
    Geplant: setup <url>\n\
    Nach der Anmeldung: courses, course, read, download, tasks, upcoming, health, logout, exit\n\
    \n\
    Starte login über den installierten Launcher in einem Terminal. Zugangsdaten werden nicht gespeichert.

