cli.help=Moodle CLI\n\
    \n\
    Aufruf: moodle [--lang de|en] [--no-store] <befehl>\n\
    \n\
    --help                 Hilfe anzeigen\n\
    --lang de|en           Systemsprache überschreiben (sonst Englisch als Ersatz)\n\
    --no-store             Gespeicherte Anmeldung nicht lesen oder ändern; nur Arbeitsspeicher nutzen\n\
    mcp                    Lokalen MCP-Server für Codex starten\n\
    health                 Öffentliche API-Konfiguration prüfen\n\
    logout                 Gespeicherte lokale Anmeldung entfernen\n\
    login                  Automatische Anmeldung im separaten privaten Chrome-Fenster\n\
    login --manual         App-Link aus deinem normalen Browser kopieren\n\
    courses                Eingeschriebene Kurse auflisten (Anmeldung erforderlich)\n\
    course <id>            Abschnitte, Texte und herunterladbare Dateien anzeigen\n\
    search <suchbegriffe>  Kurstitel, Aktivitäten und Dateinamen durchsuchen\n\
    read <kurs> <modul>    Aktivität oder Textseite lesen\n\
    assignments [--course <id>]\n\
    \                       Aufgaben, Abgabefristen und Abgabestatus anzeigen (Alias: tasks)\n\
    quizzes [--course <id>] Quizzes und Lernkontrollfragen separat anzeigen\n\
    upcoming --days <n>    Aufgaben mit Frist innerhalb der nächsten n Tage anzeigen\n\
    download <kurs> <modul> <dateinummer> [ordner]\n\
    \                       Datei speichern, ohne vorhandene Dateien zu überschreiben\n\
    \n\
    Geplant: setup <url>\n\
    Nach der Anmeldung: courses, course, search, read, download, assignments, tasks, quizzes, upcoming, health, logout, exit\n\
    \n\
    Standard: Anmeldung im Betriebssystem speichern. --no-store nutzt nur den Arbeitsspeicher.

